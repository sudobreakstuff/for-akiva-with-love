<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>For Akiva, With Love</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050812;font-family:'Inter',sans-serif;color:#f5f0e8;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:3;pointer-events:none}
#garden{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;overflow:hidden}
#garden .bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;background:linear-gradient(180deg,#050812 0%,#0a0b20 12%,#100e2e 25%,#1a1238 35%,#1e1830 45%,#1a2218 58%,#142010 70%,#0c1408 85%,#060804 100%)}
#garden .moon{position:absolute;top:3%;right:12%;width:85px;height:85px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle at 42% 40%,rgba(255,248,235,0.98),rgba(255,240,220,0.18) 44%,rgba(240,225,245,0.03) 74%);box-shadow:0 0 60px rgba(255,240,220,0.12),0 0 120px rgba(255,240,220,0.05),0 0 200px rgba(212,165,255,0.03);animation:moonGlow 7s ease-in-out infinite}
@keyframes moonGlow{0%,100%{box-shadow:0 0 60px rgba(255,240,220,0.12),0 0 120px rgba(255,240,220,0.05),0 0 200px rgba(212,165,255,0.03)}50%{box-shadow:0 0 90px rgba(255,240,220,0.22),0 0 160px rgba(255,240,220,0.1),0 0 250px rgba(212,165,255,0.06)}}
#garden .ground-glow{position:absolute;bottom:0;left:0;right:0;height:40%;pointer-events:none;z-index:1;background:radial-gradient(ellipse 80% 60% at 50% 100%,rgba(200,180,255,0.04) 0%,rgba(180,140,240,0.02) 30%,rgba(100,80,160,0.01) 60%,transparent 100%);animation:groundPulse 6s ease-in-out infinite alternate}
@keyframes groundPulse{0%{opacity:0.5}100%{opacity:1}}
#garden .mist{position:absolute;bottom:3%;left:-20%;right:-20%;height:35%;pointer-events:none;z-index:1;background:radial-gradient(ellipse 45% 100% at 25% 100%,rgba(180,160,220,0.035) 0%,transparent 70%),radial-gradient(ellipse 40% 80% at 75% 100%,rgba(150,200,220,0.025) 0%,transparent 70%);animation:mistDrift 35s ease-in-out infinite alternate}
@keyframes mistDrift{0%{transform:translateX(-5%)}100%{transform:translateX(5%)}}
/* === TREES === */
#garden .trees{position:absolute;bottom:0;left:0;right:0;height:48%;pointer-events:none;z-index:1}
#garden .trees .t{position:absolute;bottom:0}
#garden .trees .t .cr{width:0;height:0;margin:0 auto;border-left:solid transparent;border-right:solid transparent;border-bottom:solid rgba(8,10,18,0.22)}
#garden .trees .t .tr{width:4px;margin:0 auto;background:rgba(8,10,18,0.18);border-radius:2px}
#garden .trees .t1{left:2%}#garden .trees .t1 .tr{height:62px}#garden .trees .t1 .cr{border-left-width:22px;border-right-width:22px;border-bottom-width:55px}
#garden .trees .t2{left:10%}#garden .trees .t2 .tr{height:42px}#garden .trees .t2 .cr{border-left-width:16px;border-right-width:16px;border-bottom-width:38px}
#garden .trees .t3{left:20%}#garden .trees .t3 .tr{height:76px}#garden .trees .t3 .cr{border-left-width:28px;border-right-width:28px;border-bottom-width:68px}
#garden .trees .t4{right:3%}#garden .trees .t4 .tr{height:52px}#garden .trees .t4 .cr{border-left-width:20px;border-right-width:20px;border-bottom-width:48px}
#garden .trees .t5{right:14%}#garden .trees .t5 .tr{height:66px}#garden .trees .t5 .cr{border-left-width:24px;border-right-width:24px;border-bottom-width:58px}
#garden .trees .t6{right:25%}#garden .trees .t6 .tr{height:38px}#garden .trees .t6 .cr{border-left-width:14px;border-right-width:14px;border-bottom-width:32px}
#garden .trees .t7{left:45%}#garden .trees .t7 .tr{height:48px}#garden .trees .t7 .cr{border-left-width:18px;border-right-width:18px;border-bottom-width:42px}
#garden .canopy{position:absolute;top:0;left:0;right:0;height:18%;pointer-events:none;z-index:1;background:linear-gradient(180deg,rgba(8,10,18,0.5) 0%,transparent 100%)}
/* === GLOWING MUSHROOMS === */
#garden .mush{position:absolute;pointer-events:none;z-index:2}
#garden .mush .st{width:3px;margin:0 auto;background:rgba(180,200,210,0.12);border-radius:1px}
#garden .mush .cp{position:relative;width:18px;height:11px;margin:0 auto;border-radius:50% 50% 45% 45%}
#garden .mush .cp::after{content:'';position:absolute;top:-6px;left:-12px;width:42px;height:24px;border-radius:50%;background:inherit;filter:blur(10px);opacity:0.4;animation:mushGlow 3s ease-in-out infinite alternate}
@keyframes mushGlow{0%{opacity:0.25}100%{opacity:0.55}}
#garden .mush .cp .hl{position:absolute;top:2px;left:5px;width:4px;height:3px;border-radius:50%;background:rgba(255,255,255,0.3);transform:rotate(-20deg)}
#garden .m1{bottom:14%;left:6%;animation:mushBounce 4s ease-in-out infinite}
#garden .m1 .st{height:14px}#garden .m1 .cp{background:radial-gradient(circle at 40% 30%,#7af0d8,#3ab8a0);width:16px;height:10px;box-shadow:0 0 20px rgba(58,184,160,0.15)}
#garden .m2{bottom:18%;left:22%;animation:mushBounce 5s ease-in-out infinite 1s}
#garden .m2 .st{height:10px}#garden .m2 .cp{background:radial-gradient(circle at 40% 30%,#e8aaff,#b060e0);width:22px;height:13px;box-shadow:0 0 25px rgba(176,96,224,0.15)}
#garden .m3{bottom:12%;right:8%;animation:mushBounce 4.5s ease-in-out infinite 0.5s}
#garden .m3 .st{height:18px}#garden .m3 .cp{background:radial-gradient(circle at 40% 30%,#ffd78a,#e8a040);width:20px;height:12px;box-shadow:0 0 20px rgba(232,160,64,0.15)}
#garden .m4{bottom:22%;right:22%;animation:mushBounce 5.5s ease-in-out infinite 2s}
#garden .m4 .st{height:8px}#garden .m4 .cp{background:radial-gradient(circle at 40% 30%,#ff9eb0,#e05878);width:14px;height:9px;box-shadow:0 0 18px rgba(224,88,120,0.12)}
#garden .m5{bottom:10%;left:40%;animation:mushBounce 6s ease-in-out infinite 1.5s}
#garden .m5 .st{height:12px}#garden .m5 .cp{background:radial-gradient(circle at 40% 30%,#a0e0ff,#58a8d0);width:18px;height:11px;box-shadow:0 0 22px rgba(88,168,208,0.12)}
#garden .m6{bottom:20%;left:60%;animation:mushBounce 3.5s ease-in-out infinite 0.8s}
#garden .m6 .st{height:9px}#garden .m6 .cp{background:radial-gradient(circle at 40% 30%,#f0c8ff,#b888d8);width:15px;height:9px;box-shadow:0 0 18px rgba(184,136,216,0.12)}
@keyframes mushBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
/* === FLOATING SPORES === */
#garden .spores{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:hidden}
#garden .spores .s{position:absolute;width:4px;height:4px;border-radius:50%;opacity:0;animation:sporeRise var(--d,8s) ease-in var(--dd,0s) infinite}
#garden .spores .s::after{content:'';position:absolute;top:-6px;left:-6px;width:16px;height:16px;border-radius:50%;background:inherit;filter:blur(4px);opacity:0.4}
@keyframes sporeRise{0%{transform:translateY(100vh) scale(0);opacity:0}20%{opacity:var(--o,0.5)}80%{opacity:var(--o,0.5)}100%{transform:translateY(-10vh) scale(1);opacity:0}}
#garden .spores .s1{left:8%;--d:10s;--dd:0s;--o:0.4;background:rgba(200,180,255,0.5);width:3px;height:3px}
#garden .spores .s2{left:18%;--d:12s;--dd:2s;--o:0.35;background:rgba(180,230,255,0.4);width:5px;height:5px}
#garden .spores .s3{left:32%;--d:9s;--dd:4s;--o:0.45;background:rgba(255,220,180,0.4);width:3px;height:3px}
#garden .spores .s4{left:48%;--d:11s;--dd:1s;--o:0.3;background:rgba(220,200,255,0.4);width:4px;height:4px}
#garden .spores .s5{left:62%;--d:8s;--dd:5s;--o:0.4;background:rgba(200,240,230,0.4);width:3px;height:3px}
#garden .spores .s6{left:75%;--d:13s;--dd:3s;--o:0.35;background:rgba(240,200,255,0.4);width:5px;height:5px}
#garden .spores .s7{left:88%;--d:10s;--dd:6s;--o:0.4;background:rgba(255,230,200,0.4);width:3px;height:3px}
/* === GROUND LAYER === */
#garden .gl{position:absolute;bottom:0;left:0;right:0;height:25%;pointer-events:none;z-index:2;background:linear-gradient(0deg,rgba(5,8,5,0.45) 0%,transparent 100%)}
/* === TITLE === */
#ttl{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,7,15,0.94);cursor:pointer;transition:none}
#ttl.done{opacity:0;visibility:hidden;pointer-events:none;transition:opacity 0.7s ease,visibility 0.7s ease}
#ttl h1{font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(1.8rem,6.5vw,3.5rem);text-align:center;line-height:1.2;color:#f5f0e8;letter-spacing:0.04em}
#ttl h1 .nm{display:block;font-style:italic;margin-top:0.08em;background:linear-gradient(135deg,#f0d78c,#e8c4a0,#d4a5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#ttl .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(0.85rem,1.8vw,1.1rem);color:rgba(245,240,232,0.3);margin-top:1em;letter-spacing:0.06em}
#ttl .hint{position:absolute;bottom:12%;font-size:clamp(0.55rem,1vw,0.7rem);font-weight:300;color:rgba(245,240,232,0.15);letter-spacing:0.22em;text-transform:uppercase;animation:pulse 3.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.15}50%{opacity:0.6}}
#soil{position:absolute;bottom:0;left:0;right:0;height:50%;z-index:4;cursor:pointer}
#hint{position:fixed;bottom:12%;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(0.85rem,1.8vw,1rem);color:rgba(245,240,232,0.2);text-align:center;opacity:0;transition:opacity 0.8s ease;white-space:nowrap}
#hint.show{opacity:1;animation:pulse 4s ease-in-out infinite}
#hint .spark{display:inline-block;animation:float 2.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#prg{position:fixed;top:0.8rem;left:0.8rem;z-index:6;pointer-events:none;font-weight:300;font-size:0.6rem;color:rgba(245,240,232,0.12);letter-spacing:0.08em}
/* === FLOWERS === */
.flower{position:absolute;z-index:5;pointer-events:auto;width:0;height:0}
.flower .sprout{position:absolute;bottom:0;left:23px;width:5px;height:0;background:linear-gradient(to top,#3a6a30,#7ec87e);border-radius:2px;transform-origin:bottom center;box-shadow:0 0 8px rgba(126,200,126,0.3)}
.flower.seed .sprout{animation:sproutUp 0.7s ease-out forwards}
@keyframes sproutUp{0%{height:0}100%{height:var(--sprout-h,25px)}}
.flower .sprout::before{content:'';position:absolute;top:-1px;left:-4px;width:12px;height:8px;background:#7ec87e;border-radius:50%;box-shadow:0 0 12px rgba(126,200,126,0.4);transform:scale(0)}
.flower.seed .sprout::before{animation:leafPop 0.5s ease-out 0.15s forwards}
@keyframes leafPop{0%{transform:scale(0)}100%{transform:scale(1)}}
.flower .stem{position:absolute;bottom:0;left:25px;width:3px;height:var(--stem-h,55px);background:linear-gradient(to top,#3a6a30,#5a8a4e);border-radius:2px;transform-origin:bottom center;opacity:0;will-change:transform}
.flower .stem::before{content:'';position:absolute;left:-2px;top:36%;width:10px;height:6px;background:#5a8a4e;border-radius:50% 0 50% 0;transform:rotate(-20deg)}
.flower .stem::after{content:'';position:absolute;right:-2px;top:52%;width:9px;height:5px;background:#4a7c3f;border-radius:0 50% 0 50%;transform:rotate(15deg)}
.flower.bloom .stem{opacity:1;animation:sway var(--sway,3.5s) ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
/* === FLOWER HEAD (conic-gradient) === */
.flower .head{position:absolute;bottom:calc(var(--stem-h,55px));left:2px;width:48px;height:48px;border-radius:50%;opacity:0;transform:scale(0);transform-origin:bottom center;will-change:transform,opacity;box-shadow:0 0 30px 4px var(--g, rgba(255,215,0,0.15))}
.flower .head.hg{width:64px;height:64px;left:-6px;bottom:calc(var(--stem-h,70px))}
.flower.bloom .head{opacity:1;transform:scale(1);animation:bloomPop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards}
@keyframes bloomPop{0%{transform:scale(0);opacity:0}50%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.flower .head::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;background:inherit;filter:blur(10px);opacity:0.4;z-index:-1}
.flower .head::after{content:'';position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--cc,#f5f0e8);z-index:2;box-shadow:0 0 8px rgba(255,255,255,0.25)}
.flower .head.hg::after{width:18px;height:18px;margin:-9px 0 0 -9px}
/* === TAP HINT === */
.flower .tap-hint{position:absolute;bottom:calc(var(--stem-h,55px) + 56px);width:52px;left:-2px;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.7rem;color:rgba(245,240,232,0.3);pointer-events:none;opacity:0;transition:opacity 0.8s ease;letter-spacing:0.06em}
.flower .tap-hint.hg{bottom:calc(var(--stem-h,70px) + 72px);width:68px;left:-2px;font-size:0.8rem}
.flower.bloom .tap-hint{opacity:1;animation:hintFloat 2.5s ease-in-out infinite}
@keyframes hintFloat{0%,100%{transform:translateY(0);opacity:0.25}50%{transform:translateY(-5px);opacity:0.8}}
/* === CARD === */
#card{position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity 0.4s ease,visibility 0.4s ease;background:rgba(4,6,12,0.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:1rem}
#card.show{opacity:1;visibility:visible}
#card .box{background:rgba(16,22,34,0.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(245,240,232,0.05);border-radius:16px;padding:1.5rem 1.6rem;max-width:400px;width:100%;max-height:80vh;overflow-y:auto;position:relative;transform:translateY(25px) scale(0.95);transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
#card.show .box{transform:translateY(0) scale(1)}
#card .box::-webkit-scrollbar{width:3px}#card .box::-webkit-scrollbar-thumb{background:rgba(245,240,232,0.08);border-radius:4px}
#card .close{position:absolute;top:0.7rem;right:0.7rem;width:28px;height:28px;border-radius:50%;border:1px solid rgba(245,240,232,0.06);background:rgba(245,240,232,0.02);color:rgba(245,240,232,0.35);font-size:0.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.25s;font-family:'Inter',sans-serif;line-height:1}
#card .close:hover{background:rgba(245,240,232,0.06);color:#f5f0e8}
#card .num{font-size:0.55rem;letter-spacing:0.12em;color:rgba(245,240,232,0.15);border:1px solid rgba(245,240,232,0.04);padding:0.2em 0.6em;border-radius:20px;display:inline-block;margin-bottom:0.7rem;font-weight:300}
#card .photo{width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;margin-bottom:1rem;background:linear-gradient(135deg,rgba(35,30,50,0.3),rgba(20,30,25,0.3));display:flex;align-items:center;justify-content:center;position:relative}
#card .photo img{width:100%;height:100%;object-fit:cover;display:none}
#card .photo .ph{font-family:'Cormorant Garamond',serif;font-style:italic;color:rgba(245,240,232,0.1);font-size:0.75rem}
#card h2{font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(1.1rem,2.6vw,1.4rem);color:#f5f0e8;margin-bottom:0.15rem;line-height:1.3}
#card .dt{font-weight:300;font-size:0.65rem;color:rgba(245,240,232,0.25);letter-spacing:0.04em;margin-bottom:0.7rem}
#card .ms{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:clamp(0.85rem,2vw,1rem);line-height:1.6;color:rgba(245,240,232,0.7)}
/* === FINALE === */
#finale{position:fixed;top:0;left:0;width:100%;height:100%;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity 2s ease,visibility 2s ease;background:rgba(3,5,10,0.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#finale.show{opacity:1;visibility:visible}
#finale .heart{font-size:clamp(4.5rem,12vw,7rem);line-height:1;margin-bottom:1.2rem;opacity:0;transform:scale(0);transition:all 1.8s cubic-bezier(0.34,1.56,0.64,1);filter:drop-shadow(0 0 30px rgba(240,215,140,0.15)) drop-shadow(0 0 60px rgba(240,215,140,0.05));animation:heartColor 4s ease-in-out infinite}
#finale.show .heart{opacity:1;transform:scale(1)}
@keyframes heartColor{0%,100%{filter:drop-shadow(0 0 30px rgba(240,215,140,0.15)) drop-shadow(0 0 60px rgba(212,165,255,0.08))}50%{filter:drop-shadow(0 0 50px rgba(240,215,140,0.25)) drop-shadow(0 0 80px rgba(212,165,255,0.12))}}
#finale .ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(280px,72vw);height:min(260px,66vw);border-radius:50%;border:1px solid rgba(240,215,140,0.05);pointer-events:none;animation:ringSpin 25s linear infinite}
#finale .ring2{width:min(320px,80vw);height:min(300px,74vw);border:1px solid rgba(240,215,140,0.03);animation-direction:reverse;animation-duration:30s}
@keyframes ringSpin{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}
#finale .fm{text-align:center;opacity:0;transition:opacity 1.5s ease 2.5s;max-width:440px;padding:0.6rem 1rem;background:rgba(3,5,10,0.35);border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#finale.show .fm{opacity:1}
#finale .fm p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1rem,2.5vw,1.25rem);color:rgba(245,240,232,0.75);line-height:1.6}
#finale .fm .sig{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(1.05rem,2.8vw,1.45rem);background:linear-gradient(135deg,#f0d78c,#e8c4a0,#d4a5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:0.4rem;line-height:1.5}
/* === FINALE PARTICLES === */
#finale .parts{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
#finale .parts .p{position:absolute;width:3px;height:3px;background:rgba(240,215,140,0.5);border-radius:50%;opacity:0;animation:pf var(--dur,6s) ease-in var(--del,0s) infinite}
#finale .parts .p::after{content:'';position:absolute;top:-6px;left:-6px;width:15px;height:15px;border-radius:50%;background:inherit;filter:blur(4px);opacity:0.5}
@keyframes pf{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(100vh);opacity:0}}
#finale .parts .p1{left:10%;--dur:6s;--del:0.3s}#finale .parts .p2{left:22%;--dur:8s;--del:0.8s}#finale .parts .p3{left:34%;--dur:7s;--del:0s}#finale .parts .p4{left:46%;--dur:6.5s;--del:0.6s}
#finale .parts .p5{left:58%;--dur:7.5s;--del:1.2s}#finale .parts .p6{left:70%;--dur:6s;--del:0.4s}#finale .parts .p7{left:82%;--dur:8s;--del:0.9s}#finale .parts .p8{left:92%;--dur:7s;--del:0.2s}
@media(max-width:600px){#card{padding:0.5rem}#card .box{padding:1rem 1.2rem;border-radius:12px}#prg{top:0.5rem;left:0.5rem;font-size:0.5rem}}
@media(max-height:480px){#card .box{max-height:85vh;padding:0.6rem 1rem}#card .photo{max-height:20vh}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="garden">
  <div class="bg"></div>
  <div class="moon"></div>
  <div class="canopy"></div>
  <div class="trees">
    <div class="t t1"><div class="cr"></div><div class="tr"></div></div>
    <div class="t t2"><div class="cr"></div><div class="tr"></div></div>
    <div class="t t3"><div class="cr"></div><div class="tr"></div></div>
    <div class="t t4"><div class="cr"></div><div class="tr"></div></div>
    <div class="t t5"><div class="cr"></div><div class="tr"></div></div>
    <div class="t t6"><div class="cr"></div><div class="tr"></div></div>
    <div class="t t7"><div class="cr"></div><div class="tr"></div></div>
  </div>
  <div class="ground-glow"></div>
  <div class="gl"></div>
  <div class="mist"></div>
  <div class="mush m1"><div class="st"></div><div class="cp"><div class="hl"></div></div></div>
  <div class="mush m2"><div class="st"></div><div class="cp"><div class="hl"></div></div></div>
  <div class="mush m3"><div class="st"></div><div class="cp"><div class="hl"></div></div></div>
  <div class="mush m4"><div class="st"></div><div class="cp"><div class="hl"></div></div></div>
  <div class="mush m5"><div class="st"></div><div class="cp"><div class="hl"></div></div></div>
  <div class="mush m6"><div class="st"></div><div class="cp"><div class="hl"></div></div></div>
  <div class="spores"><div class="s s1"></div><div class="s s2"></div><div class="s s3"></div><div class="s s4"></div><div class="s s5"></div><div class="s s6"></div><div class="s s7"></div></div>
  <div id="soil"></div>
</div>
<div id="ttl" onclick="tapTitle(event)" ontouchstart="tapTitle(event)">
  <h1>For <span class="nm">Akiva, With Love</span></h1>
  <div class="sub">a garden of memories, growing just for you</div>
  <div class="hint">tap anywhere</div>
</div>
<div id="hint"><span class="spark">✦</span> tap the earth to plant a seed <span class="spark">✦</span></div>
<div id="prg"><span id="bloomN">0</span>&thinsp;/&thinsp;<span id="totalN">9</span></div>
<div id="card">
  <div class="box">
    <button class="close" id="cardX">&#10005;</button>
    <span class="num" id="cardNum">flower 1 of 14</span>
    <div class="photo"><span class="ph" id="cardPh">✦ a memory awaits</span><img id="cardImg" src="" alt=""></div>
    <h2 id="cardT"></h2>
    <div class="dt" id="cardD"></div>
    <div class="ms" id="cardM"></div>
  </div>
</div>
<div id="finale">
  <div class="heart">&hearts;</div>
  <div class="ring"></div>
  <div class="ring ring2"></div>
  <div class="parts"><div class="p p1"></div><div class="p p2"></div><div class="p p3"></div><div class="p p4"></div><div class="p p5"></div><div class="p p6"></div><div class="p p7"></div><div class="p p8"></div></div>
  <div class="fm">
    <p>Every flower in this garden holds a piece of my heart.</p>
    <div class="sig">Akiva, you are my everything.<br>Forever yours, &mdash; Shahid</div>
  </div>
</div>
<script>
const FLOWERS = [
  {t:"The First Spark",d:"The day we met",m:"I don't remember exactly what I expected when I first saw you. But I remember thinking: there's something different about this one. Like the universe had been quietly arranging a meeting it knew was inevitable.",c:"#ff6b9d",cc:"#ffd700",s:1,sh:55,g:"rgba(255,107,157,0.35)"},
  {t:"Getting to Know You",d:"Our first real conversations",m:"Those early talks — staying up late, trading stories, finding pieces of ourselves in each other. Every question I asked, every answer you gave, I felt like I was unwrapping a gift.",c:"#7ec8e3",cc:"#fff",s:1.1,sh:60,g:"rgba(126,200,227,0.3)"},
  {t:"Our First Night",d:"Staying up until sunrise",m:"Time stopped meaning anything. The hours slipped by like water through fingers. I watched the dawn paint the sky and thought: I want to see a thousand more dawns with this person.",c:"#d4a5ff",cc:"#f5f0e8",s:.85,sh:50,g:"rgba(212,165,255,0.3)"},
  {t:"Our First Adventure",d:"Exploring the world together",m:"We didn't need a destination. Being with you made every place feel like somewhere I wanted to be. The world looked different through your eyes — brighter, stranger, more full of wonder.",c:"#f0d78c",cc:"#e8a87c",s:.95,sh:55,g:"rgba(240,215,140,0.35)"},
  {t:"Growing Closer",d:"The early, tender days",m:"The in-between moments. A hand reaching for mine. A shared laugh at something only we understood. Learning the small things — how you take your tea, the way you hum when you're happy.",c:"#6b9e5e",cc:"#a8d5a2",s:.9,sh:52,g:"rgba(107,158,94,0.25)"},
  {t:"The Deep Talks",d:"Late nights, honest words",m:"We peeled back the layers. Fears, dreams, the parts of ourselves we don't show everyone. You listened without judgment and shared without hesitation. I found not just you, but a better version of myself.",c:"#c4a0ff",cc:"#ff6b9d",s:1.05,sh:58,g:"rgba(196,160,255,0.3)"},
  {t:"Rainy Days",d:"A cozy memory",m:"The rain came down in sheets, and we didn't care. Wrapped up together, warm and dry, while the world washed itself clean. Sometimes the best days are the ones where nothing happens — except everything that matters.",c:"#4a8ea8",cc:"#c4d8e0",s:.95,sh:55,g:"rgba(74,142,168,0.25)"},
  {t:"Wishes",d:"Dreaming together",m:"We talked about the future like it was a garden we were planning. Where we'd go, what we'd do, who we wanted to become. Every wish we shared felt like planting another seed.",c:"#e8a87c",cc:"#c47a5a",s:.8,sh:50,g:"rgba(232,168,124,0.2)"},
  {t:"Forever Us",d:"9 years and counting",m:"This one has no special date, no big story. It's just because I was thinking of you. Nine years, and I still feel the same way I did on day one. You are loved, completely and without condition. This flower is just because you exist, and that makes the world more beautiful.",c:"#f0d78c",cc:"#d4a5ff",s:1.5,sh:72,g:"rgba(240,215,140,0.35)"}
];
const S={started:false,next:0,bloomed:0,planting:false,finale:false,audio:null,aOk:false,aPlay:false};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;let stars=[];let flies=[];let dust=[];let burst=[];
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);initStars()}
resize();addEventListener('resize',resize);
function initStars(){stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.5,r:0.4+Math.random()*1.4,op:0.15+Math.random()*0.75,ph:Math.random()*6.28,sp:0.15+Math.random()*0.5})}
function initFlies(){const n=Math.min(20,10+S.bloomed*0.7);while(flies.length<n)flies.push(new Fly());while(flies.length>n)flies.pop()}
class Fly{constructor(){this.reset()}reset(){this.x=Math.random()*W;this.y=Math.random()*H*0.75;this.vx=(Math.random()-0.5)*0.22;this.vy=(Math.random()-0.5)*0.14;this.r=1+Math.random()*2.5;this.ph=Math.random()*6.28;this.op=0.2+Math.random()*0.55}
update(){this.x+=this.vx+Math.sin(Date.now()*0.001+this.ph)*0.07;this.y+=this.vy+Math.cos(Date.now()*0.0012+this.ph)*0.06;if(this.x<-30||this.x>W+30||this.y<-30||this.y>H+30)this.reset()}
draw(){const p=0.5+0.5*Math.sin(Date.now()*0.002+this.ph),a=this.op*p,rr=this.r*(0.7+0.6*p);const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,rr*6);g.addColorStop(0,`rgba(240,215,140,${a})`);g.addColorStop(0.2,`rgba(200,185,230,${a*0.35})`);g.addColorStop(1,'rgba(200,185,230,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,rr*6,0,6.28);ctx.fill();ctx.fillStyle=`rgba(255,248,230,${a*0.85})`;ctx.beginPath();ctx.arc(this.x,this.y,rr*0.4,0,6.28);ctx.fill()}}
function sd(x,y){if(!S.started)return;for(let i=0;i<2;i++)dust.push({x:x+(Math.random()-0.5)*14,y:y+(Math.random()-0.5)*8,vx:(Math.random()-0.5)*1.2,vy:-Math.random()*1.2-0.2,life:1,decay:0.005+Math.random()*0.01,r:0.8+Math.random()*1.8});if(dust.length>120)dust.splice(0,dust.length-120)}
function brst(x,y,color,n){n=n||22;for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=0.8+Math.random()*3;burst.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.8,life:1,decay:0.01+Math.random()*0.016,r:1.5+Math.random()*2.5,color:color||'#f0d78c'})}}
function anim(){ctx.clearRect(0,0,W,H);
  for(const s of stars){const p=0.5+0.5*Math.sin(Date.now()*0.001*s.sp+s.ph);ctx.fillStyle=`rgba(245,240,232,${s.op*p*0.55})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill()}
  initFlies();for(const f of flies){f.update();f.draw()}
  for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.x+=d.vx;d.y+=d.vy;d.vy+=0.012;d.life-=d.decay;if(d.life<=0){dust.splice(i,1);continue}ctx.globalAlpha=d.life*0.5;ctx.fillStyle='#f0d78c';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.28);ctx.fill();ctx.globalAlpha=d.life*0.15;ctx.beginPath();ctx.arc(d.x,d.y,d.r*5,0,6.28);ctx.fill();ctx.globalAlpha=1}
  for(let i=burst.length-1;i>=0;i--){const b=burst[i];b.x+=b.vx;b.y+=b.vy;b.vy+=0.02;b.life-=b.decay;if(b.life<=0){burst.splice(i,1);continue}ctx.globalAlpha=b.life;ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r*(0.4+0.6*b.life),0,6.28);ctx.fill();ctx.globalAlpha=b.life*0.2;ctx.beginPath();ctx.arc(b.x,b.y,b.r*3.5*b.life,0,6.28);ctx.fill();ctx.globalAlpha=1}
  requestAnimationFrame(anim)}
anim();
function makeHead(c,cc,g,sz,big){
  const el=document.createElement('div');el.className='head';
  if(big)el.classList.add('hg');
  el.style.background=`radial-gradient(circle at 50% 50%,${cc} 7px,transparent 9px),conic-gradient(from 0deg,${c} 0deg 48deg,transparent 48deg 60deg,${c} 60deg 108deg,transparent 108deg 120deg,${c} 120deg 168deg,transparent 168deg 180deg,${c} 180deg 228deg,transparent 228deg 240deg,${c} 240deg 288deg,transparent 288deg 300deg,${c} 300deg 348deg,transparent 348deg 360deg)`;
  el.style.setProperty('--g',g||'rgba(255,215,0,0.15)');
  el.style.setProperty('--cc',cc);
  el.style.boxShadow=`0 0 30px 4px ${g||'rgba(255,215,0,0.15)'}`;
  return el
}
const soil=document.getElementById('soil');
const hint=document.getElementById('hint');
const bloomN=document.getElementById('bloomN');
const totalN=document.getElementById('totalN');
totalN.textContent=FLOWERS.length;
const garden=document.getElementById('garden');
const flowers=[];
function getPos(){
  for(let a=0;a<50;a++){
    const x=60+Math.random()*(W-120),y=H*0.2+Math.random()*(H*0.45);
    let ok=true;
    for(const f of flowers){const r=f.el.getBoundingClientRect();if(r.left&&Math.abs(r.left-x)<65&&Math.abs(r.top-y)<80){ok=false;break}}
    if(ok)return{x,y}
  }
  return{x:60+Math.random()*(W-120),y:H*0.2+Math.random()*(H*0.3)}
}
function makeFlower(data,i,x,y){
  const el=document.createElement('div');
  el.className='flower seed';
  const sh=data.sh||55,sz=(data.s||1)*48,big=i===8;
  const headSize=big?64:48,headOff=big?-6:2;
  el.style.left=(x-headSize/2)+'px';el.style.top=(y+sh+headSize/2)+'px';
  el.innerHTML=`<div class="sprout" style="--sprout-h:${sh*0.4}px"></div>
<div class="stem" style="--stem-h:${sh}px;--sway:${(2.8+Math.random()*1.4).toFixed(2)}s"></div>
<div class="tap-hint${big?' hg':''}">✦ tap me ✦</div>`;
  const head=makeHead(data.c,data.cc,data.g,sz,big);
  el.appendChild(head);
  garden.appendChild(el);
  flowers.push({el,index:i,data,state:'seed',x,y});
  setTimeout(()=>{
    el.classList.remove('seed');el.classList.add('bloom');
    brst(x+headSize/2+2,y-sh*0.3,data.g||'#f0d78c',16);
    if(big)setTimeout(()=>brst(x+headSize/2+2,y-sh*0.3,'#ffd700',30),300);
    S.next=i+1;S.planting=false;
    if(S.next<FLOWERS.length)hint.classList.add('show');
    el.addEventListener('click',e=>{e.stopPropagation();openCard(i)});
    el.addEventListener('touchend',e=>{e.stopPropagation();openCard(i)});
  },900);
}
function plant(x,y){
  if(!S.started||S.planting||S.next>=FLOWERS.length){if(!S.finale&&S.bloomed>=FLOWERS.length)showFinale();return}
  S.planting=true;const data=FLOWERS[S.next];
  hint.classList.remove('show');
  brst(x+(Math.random()-0.5)*20,y+(Math.random()-0.5)*20,data.g||'#f0d78c',20);
  makeFlower(data,S.next,x,y);
}
function openCard(i){
  const data=FLOWERS[i];if(!data)return;
  const f=flowers.find(f=>f.index===i);if(f&&f.state==='opened')return;if(f)f.state='opened';
  document.getElementById('cardNum').textContent=`flower ${i+1} of ${FLOWERS.length}`;
  document.getElementById('cardT').textContent=data.t;
  document.getElementById('cardD').textContent=data.d;
  document.getElementById('cardM').textContent=data.m;
  const img=document.getElementById('cardImg'),ph=document.getElementById('cardPh');
  img.src=`assets/photos/${i+1}.jpg`;
  img.onload=()=>{ph.style.display='none';img.style.display='block'};
  img.onerror=()=>{ph.style.display='block';img.style.display='none';ph.textContent='✦ a memory awaits'};
  if(S.bloomed<=i){S.bloomed=Math.max(S.bloomed,i+1);initFlies()}
  document.getElementById('card').classList.add('show');
  document.getElementById('bloomN').textContent=S.bloomed;
  if(S.bloomed>=FLOWERS.length)setTimeout(()=>showFinale(),1200);
}
function showFinale(){if(S.finale)return;S.finale=true;document.getElementById('finale').classList.add('show');swellAudio();for(let i=0;i<6;i++)setTimeout(()=>{brst(W*0.5+(Math.random()-0.5)*200,H*0.3+(Math.random()-0.5)*120,'#ffd700',30)},i*400)}
function initAudio(){S.audio=new Audio();S.audio.src='assets/audio/mirrors.mp3';S.audio.loop=false;S.audio.volume=0;S.audio.preload='auto';S.audio.addEventListener('canplaythrough',()=>S.aOk=true);S.audio.addEventListener('error',()=>{})}
function startAudio(){if(!S.audio||!S.aOk||S.aPlay)return;S.aPlay=true;S.audio.currentTime=0;S.audio.play().catch(()=>{});let v=0;const iv=setInterval(()=>{v+=0.035;if(v>=0.15){v=0.15;clearInterval(iv)}S.audio.volume=v},150);S.audio.addEventListener('ended',()=>{S.audio.currentTime=0;S.audio.play().catch(()=>{})})}
function swellAudio(){if(!S.audio||!S.aPlay)return;let v=0.15;const iv=setInterval(()=>{v+=0.03;if(v>=0.45){v=0.45;clearInterval(iv)}S.audio.volume=v},200)}
function tapTitle(e){
  if(e&&e.preventDefault)e.preventDefault();if(S.started)return;
  S.started=true;document.getElementById('ttl').classList.add('done');startAudio();
  S.planting=true;
  brst(W/2+(Math.random()-0.5)*40,H/2+(Math.random()-0.5)*40,'#f0d78c',40);
  setTimeout(()=>brst(W/2+(Math.random()-0.5)*20,H/2+(Math.random()-0.5)*20,'#f0d78c',20),300);
  makeFlower(FLOWERS[0],0,W/2,H/2);
}
function interact(x,y){
  if(!S.started){tapTitle();return}
  if(S.planting){brst(x+(Math.random()-0.5)*16,y+(Math.random()-0.5)*16,'rgba(240,215,140,0.7)',14);return}
  plant(x,y)
}
soil.addEventListener('click',e=>{const r=garden.getBoundingClientRect();interact(e.clientX-r.left,e.clientY-r.top)});
soil.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0],r=garden.getBoundingClientRect();interact(t.clientX-r.left,t.clientY-r.top)},{passive:false});
garden.addEventListener('mousemove',e=>sd(e.clientX,e.clientY));
garden.addEventListener('touchmove',e=>{const t=e.touches[0];sd(t.clientX,t.clientY)},{passive:true});
document.getElementById('cardX').addEventListener('click',()=>document.getElementById('card').classList.remove('show'));
document.getElementById('card').addEventListener('click',e=>{if(e.target===document.getElementById('card'))document.getElementById('card').classList.remove('show')});
initAudio();
totalN.textContent=FLOWERS.length;
</script>
</body>
</html>
